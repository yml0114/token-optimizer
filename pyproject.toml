[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "token-optimizer"
version = "0.1.0"
description = "Universal LLM Token Optimization Engine - Save 80-90% on API costs"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Token Optimizer Team" }]
keywords = ["llm", "token", "optimization", "cache", "deepseek", "mimo"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/token_optimizer"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
