name: Benchmarks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  benchmark:
    name: Benchmark suite / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run unit tests
        run: |
          python -m pytest

      - name: Run adaptive quality benchmark
        run: |
          python quality_benchmark.py

      - name: Run real-world benchmark
        run: |
          python benchmarks/realworld/run_realworld.py

      - name: Run adversarial benchmark
        run: |
          python benchmarks/adversarial/run_adversarial.py --min-rate 0.85

      - name: Compile Python sources
        run: |
          python -m compileall -q src quality_benchmark.py benchmarks tests
